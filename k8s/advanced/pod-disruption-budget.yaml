# 🛡️ Pod Disruption Budget Configuration
# Ensures high availability during cluster maintenance

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: ai-absence-sow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: ai-absence-sow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: absence-service-pdb
  namespace: ai-absence-sow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: absence-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: ai-absence-sow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: postgres