# 🔐 Kubernetes Secrets for Sensitive Configuration
# Note: In production, use Oracle Vault or external secret management

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Gemini API Key (replace with actual key)
  GEMINI_API_KEY: "your-gemini-api-key-here"
  
  # Database Credentials
  DB_USERNAME: "postgres"
  DB_PASSWORD: "your-secure-password-here"
  
  # JWT Secret for session management
  JWT_SECRET: "your-jwt-secret-key-here"
  
  # Oracle Cloud credentials (if needed)
  OCI_USER_OCID: "your-oci-user-ocid"
  OCI_FINGERPRINT: "your-oci-fingerprint"
  OCI_TENANCY_OCID: "your-oci-tenancy-ocid"
  OCI_REGION: "us-phoenix-1"

---
# TLS Secret for HTTPS (will be populated by cert-manager)
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # These will be populated by cert-manager
  tls.crt: ""
  tls.key: ""