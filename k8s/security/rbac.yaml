# 🔐 Role-Based Access Control (RBAC) Configuration

# Service Account for AI Absence SOW Application
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-absence-sow-sa
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: security
automountServiceAccountToken: true

---
# ClusterRole for Application Operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-absence-sow-role
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: security
rules:
# Pod operations
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/status"]
  verbs: ["get", "list", "watch"]
# Service operations
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]
# ConfigMap and Secret operations
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# PersistentVolume operations
- apiGroups: [""]
  resources: ["persistentvolumes", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
# Deployment operations
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
# Ingress operations
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-absence-sow-binding
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: security
subjects:
- kind: ServiceAccount
  name: ai-absence-sow-sa
  namespace: ai-absence-sow
roleRef:
  kind: ClusterRole
  name: ai-absence-sow-role
  apiGroup: rbac.authorization.k8s.io

---
# Role for Namespace-specific Operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ai-absence-sow
  name: ai-absence-sow-namespace-role
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: security
rules:
# Full access to namespace resources
- apiGroups: [""]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["networking.k8s.io"]
  resources: ["*"]
  verbs: ["*"]

---
# RoleBinding for Namespace Operations
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-absence-sow-namespace-binding
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: security
subjects:
- kind: ServiceAccount
  name: ai-absence-sow-sa
  namespace: ai-absence-sow
roleRef:
  kind: Role
  name: ai-absence-sow-namespace-role
  apiGroup: rbac.authorization.k8s.io