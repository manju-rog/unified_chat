# 💾 Storage Classes for Oracle Cloud

# High Performance SSD Storage Class
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oci-bv-high-perf
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: blockvolume.csi.oraclecloud.com
parameters:
  type: "HighPerformance"
  fsType: "ext4"
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer

---
# Balanced Performance Storage Class (Default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oci-bv
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: blockvolume.csi.oraclecloud.com
parameters:
  type: "Balanced"
  fsType: "ext4"
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer

---
# Low Cost Storage Class
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
