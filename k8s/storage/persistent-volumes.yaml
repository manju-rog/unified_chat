# 📁 Persistent Volume Claims for Application Data

# Generated Documents Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: generated-docs-pvc
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: oci-bv
  resources:
    requests:
      storage: 10Gi

---
# Absence Service Data Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: absence-data-pvc
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oci-bv
  resources:
    requests:
      storage: 5Gi

---
# Backup Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-storage-pvc
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oci-bv-low-cost
  resources:
    requests:
      storage: 50Gi

---
# Log Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-storage-pvc
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: logging
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oci-bv
  resources:
    requests:
      storage: 20Gi