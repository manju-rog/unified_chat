# 🗄️ PostgreSQL Initialization Scripts

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: database
data:
  01-init-database.sql: |
    -- AI Absence & SOW System Database Initialization
    
    -- Create absence management tables
    CREATE TABLE IF NOT EXISTS employees (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        email VARCHAR(255) UNIQUE,
        department VARCHAR(255),
        position VARCHAR(255),
        hire_date DATE,
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE TABLE IF NOT EXISTS absence_records (
        id SERIAL PRIMARY KEY,
        employee_id INTEGER REFERENCES employees(id),
        absence_date DATE NOT NULL,
        status VARCHAR(10) NOT NULL CHECK (status IN ('A', 'P', 'V')),
        reason TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(employee_id, absence_date)
    );
    
    -- Create SOW management tables
    CREATE TABLE IF NOT EXISTS sow_sessions (
        id SERIAL PRIMARY KEY,
        session_id VARCHAR(255) UNIQUE NOT NULL,
        project_name VARCHAR(255),
        client_name VARCHAR(255),
        status VARCHAR(50) DEFAULT 'draft',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE TABLE IF NOT EXISTS sow_documents (
        id SERIAL PRIMARY KEY,
        session_id VARCHAR(255) REFERENCES sow_sessions(session_id),
        document_path VARCHAR(500),
        document_name VARCHAR(255),
        file_size BIGINT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create indexes for performance
    CREATE INDEX IF NOT EXISTS idx_employees_name ON employees(name);
    CREATE INDEX IF NOT EXISTS idx_employees_department ON employees(department);
    CREATE INDEX IF NOT EXISTS idx_absence_records_date ON absence_records(absence_date);
    CREATE INDEX IF NOT EXISTS idx_absence_records_employee ON absence_records(employee_id);
    CREATE INDEX IF NOT EXISTS idx_sow_sessions_status ON sow_sessions(status);
    
    -- Insert sample data
    INSERT INTO employees (name, email, department, position) VALUES
    ('John Doe', 'john.doe@company.com', 'Engineering', 'Software Developer'),
    ('Jane Smith', 'jane.smith@company.com', 'Engineering', 'Senior Developer'),
    ('Mike Johnson', 'mike.johnson@company.com', 'QA', 'QA Engineer'),
    ('Sarah Wilson', 'sarah.wilson@company.com', 'Management', 'Project Manager'),
    ('David Brown', 'david.brown@company.com', 'Engineering', 'DevOps Engineer')
    ON CONFLICT (email) DO NOTHING;
    
  02-create-users.sql: |
    -- Create application users with appropriate permissions
    
    -- Create read-only user for reporting
    CREATE USER IF NOT EXISTS absence_reader WITH PASSWORD 'reader_password_change_me';
    GRANT CONNECT ON DATABASE absence_db TO absence_reader;
    GRANT USAGE ON SCHEMA public TO absence_reader;
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO absence_reader;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO absence_reader;
    
    -- Create application user with full access
    CREATE USER IF NOT EXISTS absence_app WITH PASSWORD 'app_password_change_me';
    GRANT CONNECT ON DATABASE absence_db TO absence_app;
    GRANT USAGE, CREATE ON SCHEMA public TO absence_app;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO absence_app;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO absence_app;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO absence_app;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO absence_app;