# 🌐 Kubernetes Services for Internal Communication

# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: frontend

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5002"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 5002
    targetPort: 5002
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: backend

---
# Absence Service
apiVersion: v1
kind: Service
metadata:
  name: absence-service
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: absence-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: absence-service

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: database

---
# Load Balancer Service for External Access
apiVersion: v1
kind: Service
metadata:
  name: ai-absence-sow-lb
  namespace: ai-absence-sow
  labels:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: load-balancer
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "100"
    service.beta.kubernetes.io/oci-load-balancer-ssl-ports: "443"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 80
    protocol: TCP
    name: https
  selector:
    app.kubernetes.io/name: ai-absence-sow
    app.kubernetes.io/component: frontend