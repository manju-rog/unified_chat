# 🔐 Secrets Template - DevOps to populate with actual values
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-absence-sow
type: Opaque
data:
  # Base64 encoded values - DevOps to replace with actual secrets
  DB_USERNAME: cG9zdGdyZXM=  # postgres (example)
  DB_PASSWORD: Y2hhbmdlbWU=   # changeme (example - CHANGE THIS!)
  GEMINI_API_KEY: eW91cl9hcGlfa2V5X2hlcmU=  # your_api_key_here (example - CHANGE THIS!)

---
# Note for DevOps:
# 1. Replace the example base64 values with actual secrets
# 2. Use proper secret management tools (Vault, Sealed Secrets, etc.)
# 3. Never commit actual secrets to version control
# 
# To encode secrets:
# echo -n "your_secret_value" | base64