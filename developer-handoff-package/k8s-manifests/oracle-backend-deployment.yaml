apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-oracle
  namespace: ai-absence-sow
  labels:
    app: backend-oracle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-oracle
  template:
    metadata:
      labels:
        app: backend-oracle
    spec:
      containers:
      - name: backend
        image: ai-absence-backend-oracle:latest  # DevOps to update with registry URL
        ports:
        - containerPort: 5002
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config-oracle
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config-oracle
              key: DB_PORT
        - name: DB_SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config-oracle
              key: DB_SERVICE_NAME
        - name: DB_SCHEMA
          valueFrom:
            configMapKeyRef:
              name: app-config-oracle
              key: DB_SCHEMA
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets-oracle
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets-oracle
              key: DB_PASSWORD
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets-oracle
              key: GEMINI_API_KEY
        - name: DATABASE_URL
          value: "oracle+cx_oracle://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_SERVICE_NAME)"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5002
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service-oracle
  namespace: ai-absence-sow
spec:
  selector:
    app: backend-oracle
  ports:
  - port: 5002
    targetPort: 5002
  type: ClusterIP