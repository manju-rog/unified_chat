apiVersion: apps/v1
kind: Deployment
metadata:
  name: absence-service-oracle
  namespace: ai-absence-sow
  labels:
    app: absence-service-oracle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: absence-service-oracle
  template:
    metadata:
      labels:
        app: absence-service-oracle
    spec:
      containers:
      - name: absence-service
        image: ai-absence-service-oracle:latest  # DevOps to update with registry URL
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config-oracle
              key: ORACLE_JDBC_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets-oracle
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets-oracle
              key: DB_PASSWORD
        - name: SPRING_JPA_DATABASE_PLATFORM
          valueFrom:
            configMapKeyRef:
              name: app-config-oracle
              key: ORACLE_DIALECT
        - name: SPRING_PROFILES_ACTIVE
          value: "production,oracle"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "validate"
        - name: SPRING_JPA_SHOW_SQL
          value: "false"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: absence-service-oracle
  namespace: ai-absence-sow
spec:
  selector:
    app: absence-service-oracle
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP