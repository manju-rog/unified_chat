apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-db
  namespace: ai-absence-sow
  labels:
    app: oracle-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle-db
  template:
    metadata:
      labels:
        app: oracle-db
    spec:
      containers:
      - name: oracle-xe
        image: container-registry.oracle.com/database/express:21.3.0-xe
        ports:
        - containerPort: 1521
        env:
        - name: ORACLE_PWD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ORACLE_PASSWORD
        - name: ORACLE_CHARACTERSET
          value: "AL32UTF8"
        volumeMounts:
        - name: oracle-storage
          mountPath: /opt/oracle/oradata
        - name: init-scripts
          mountPath: /opt/oracle/scripts/startup
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/$ORACLE_PWD@localhost:1521/XE"
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/$ORACLE_PWD@localhost:1521/XE"
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: oracle-storage
        persistentVolumeClaim:
          claimName: oracle-pvc
      - name: init-scripts
        configMap:
          name: oracle-init-scripts

---
apiVersion: v1
kind: Service
metadata:
  name: oracle-service
  namespace: ai-absence-sow
spec:
  selector:
    app: oracle-db
  ports:
  - port: 1521
    targetPort: 1521
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oracle-pvc
  namespace: ai-absence-sow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # DevOps: Add storageClassName as per your cluster configuration