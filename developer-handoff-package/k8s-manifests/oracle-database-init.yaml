apiVersion: v1
kind: ConfigMap
metadata:
  name: oracle-init-scripts
  namespace: ai-absence-sow
data:
  01-create-user.sql: |
    -- Create application user and schema
    ALTER SESSION SET "_ORACLE_SCRIPT"=true;
    
    -- Create user for the application
    CREATE USER ai_absence IDENTIFIED BY ai_absence_password;
    
    -- Grant necessary privileges
    GRANT CONNECT, RESOURCE, DBA TO ai_absence;
    GRANT CREATE SESSION TO ai_absence;
    GRANT CREATE TABLE TO ai_absence;
    GRANT CREATE SEQUENCE TO ai_absence;
    GRANT CREATE VIEW TO ai_absence;
    GRANT CREATE PROCEDURE TO ai_absence;
    GRANT CREATE TRIGGER TO ai_absence;
    GRANT UNLIMITED TABLESPACE TO ai_absence;
    
    -- Set default tablespace
    ALTER USER ai_absence DEFAULT TABLESPACE USERS;
    ALTER USER ai_absence TEMPORARY TABLESPACE TEMP;
    
    EXIT;
    
  02-create-schema.sql: |
    -- Connect as application user
    CONNECT ai_absence/ai_absence_password@localhost:1521/XE;
    
    -- AI Absence & SOW System Database Schema for Oracle
    
    -- Create employees table
    CREATE TABLE employees (
        id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        name VARCHAR2(255) NOT NULL,
        email VARCHAR2(255) UNIQUE NOT NULL,
        department VARCHAR2(100),
        position VARCHAR2(100),
        hire_date DATE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create absence_requests table
    CREATE TABLE absence_requests (
        id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        employee_id NUMBER,
        start_date DATE NOT NULL,
        end_date DATE NOT NULL,
        absence_type VARCHAR2(50) NOT NULL,
        reason CLOB,
        status VARCHAR2(20) DEFAULT 'pending',
        approved_by NUMBER,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT fk_absence_employee FOREIGN KEY (employee_id) REFERENCES employees(id),
        CONSTRAINT fk_absence_approver FOREIGN KEY (approved_by) REFERENCES employees(id)
    );
    
    -- Create sow_requests table
    CREATE TABLE sow_requests (
        id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        employee_id NUMBER,
        project_name VARCHAR2(255) NOT NULL,
        description CLOB,
        start_date DATE,
        end_date DATE,
        budget NUMBER(10,2),
        status VARCHAR2(20) DEFAULT 'draft',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT fk_sow_employee FOREIGN KEY (employee_id) REFERENCES employees(id)
    );
    
    -- Create chat_sessions table
    CREATE TABLE chat_sessions (
        id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        session_id VARCHAR2(255) UNIQUE NOT NULL,
        employee_id NUMBER,
        session_type VARCHAR2(50),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT fk_session_employee FOREIGN KEY (employee_id) REFERENCES employees(id)
    );
    
    -- Create indexes for better performance
    CREATE INDEX idx_employees_email ON employees(email);
    CREATE INDEX idx_absence_requests_employee_id ON absence_requests(employee_id);
    CREATE INDEX idx_absence_requests_dates ON absence_requests(start_date, end_date);
    CREATE INDEX idx_sow_requests_employee_id ON sow_requests(employee_id);
    CREATE INDEX idx_chat_sessions_session_id ON chat_sessions(session_id);
    
    -- Create triggers for updated_at timestamps
    CREATE OR REPLACE TRIGGER trg_employees_updated_at
        BEFORE UPDATE ON employees
        FOR EACH ROW
    BEGIN
        :NEW.updated_at := CURRENT_TIMESTAMP;
    END;
    /
    
    CREATE OR REPLACE TRIGGER trg_absence_requests_updated_at
        BEFORE UPDATE ON absence_requests
        FOR EACH ROW
    BEGIN
        :NEW.updated_at := CURRENT_TIMESTAMP;
    END;
    /
    
    CREATE OR REPLACE TRIGGER trg_sow_requests_updated_at
        BEFORE UPDATE ON sow_requests
        FOR EACH ROW
    BEGIN
        :NEW.updated_at := CURRENT_TIMESTAMP;
    END;
    /
    
    CREATE OR REPLACE TRIGGER trg_chat_sessions_updated_at
        BEFORE UPDATE ON chat_sessions
        FOR EACH ROW
    BEGIN
        :NEW.updated_at := CURRENT_TIMESTAMP;
    END;
    /
    
    COMMIT;
    EXIT;
    
