apiVersion: apps/v1
kind: Deployment
metadata:
  name: absence-service
  namespace: ai-absence-sow
  labels:
    app: absence-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: absence-service
  template:
    metadata:
      labels:
        app: absence-service
    spec:
      containers:
      - name: absence-service
        image: ai-absence-service:latest  # DevOps to update with registry URL
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/ai_absence_db"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: absence-service
  namespace: ai-absence-sow
spec:
  selector:
    app: absence-service
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP