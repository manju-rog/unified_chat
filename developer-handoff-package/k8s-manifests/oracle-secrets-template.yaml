# 🔐 Oracle Secrets Template - DevOps to populate with actual values
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets-oracle
  namespace: ai-absence-sow
type: Opaque
data:
  # Base64 encoded values - DevOps to replace with actual secrets
  DB_USERNAME: YWlfYWJzZW5jZQ==  # ai_absence (example)
  DB_PASSWORD: YWlfYWJzZW5jZV9wYXNzd29yZA==   # ai_absence_password (example - CHANGE THIS!)
  ORACLE_PASSWORD: b3JhY2xlX3Bhc3N3b3Jk  # oracle_password (example - CHANGE THIS!)
  GEMINI_API_KEY: eW91cl9hcGlfa2V5X2hlcmU=  # your_api_key_here (example - CHANGE THIS!)

---
# Note for DevOps:
# 1. Replace the example base64 values with actual secrets
# 2. Use proper secret management tools (Vault, Sealed Secrets, etc.)
# 3. Never commit actual secrets to version control
# 4. ORACLE_PASSWORD is for the Oracle system user (system/oracle)
# 5. DB_USERNAME/DB_PASSWORD is for the application user (ai_absence)
# 
# To encode secrets:
# echo -n "your_secret_value" | base64
#
# Oracle Database Access:
# - System User: system / ORACLE_PASSWORD
# - Application User: ai_absence / DB_PASSWORD
# - Connection: oracle-service:1521/XE