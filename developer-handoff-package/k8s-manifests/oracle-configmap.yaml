apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-oracle
  namespace: ai-absence-sow
data:
  # Oracle Database Configuration
  DB_HOST: "oracle-service"
  DB_PORT: "1521"
  DB_SERVICE_NAME: "XE"
  DB_SCHEMA: "ai_absence"
  
  # API URLs
  BACKEND_URL: "http://backend-service:5002"
  ABSENCE_SERVICE_URL: "http://absence-service:8080"
  FRONTEND_URL: "http://frontend-service:80"
  
  # Application Settings
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  
  # Oracle Specific Settings
  ORACLE_JDBC_URL: "jdbc:oracle:thin:@oracle-service:1521:XE"
  ORACLE_DIALECT: "org.hibernate.dialect.Oracle12cDialect"