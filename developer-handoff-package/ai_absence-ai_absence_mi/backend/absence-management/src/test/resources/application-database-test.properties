# Database Test Configuration
# This configuration is specifically for testing database connectivity

# SQLite Database Configuration for Testing
spring.datasource.url=jdbc:sqlite:./test-abscent.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA/Hibernate Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration for Testing
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.core=DEBUG

# Disable AI configuration for database tests
ai.gemini.api-key=test-key
ai.gemini.api-url=http://localhost:8080/test
ai.gemini.timeout-seconds=5
ai.conversation.timeout-minutes=5
ai.conversation.max-conversation-history=5